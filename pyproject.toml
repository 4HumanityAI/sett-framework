[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sett-framework"
version = "0.13.0"
description = "Scalable Expert-based Task Topology: A multi-agent AI development framework"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Eduardo Daniel Viñales" }
]
keywords = [
    "multi-agent", "AI", "framework", "SETT",
    "orchestrator", "LLM", "ethical-AI", "Badger",
    "executor", "actions-as-data"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []  # Core framework has zero mandatory dependencies

[project.optional-dependencies]
anthropic       = ["anthropic>=0.40.0"]
openai          = ["openai>=1.40.0"]
gemini          = ["google-generativeai>=0.8.0"]
google-tts-stt  = ["google-cloud-texttospeech>=2.16.0", "google-cloud-speech>=2.26.0"]
google-sentiment = ["google-cloud-language>=2.13.0"]
elevenlabs      = ["requests>=2.31.0"]
voice-http      = ["requests>=2.31.0"]
deepgram        = ["requests>=2.31.0"]
azure-speech    = ["requests>=2.31.0"]
assemblyai      = ["requests>=2.31.0"]
gladia          = ["requests>=2.31.0"]
openai-audio    = ["requests>=2.31.0"]
cartesia        = ["requests>=2.31.0"]
local-tts       = ["pyttsx3>=2.90"]
local-stt       = ["faster-whisper>=1.0.0"]
kokoro          = ["kokoro>=0.9.4"]
piper           = ["piper-tts>=1.2.0"]
edge-tts        = ["edge-tts>=6.1.0"]
all             = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    "google-cloud-texttospeech>=2.16.0",
    "google-cloud-speech>=2.26.0",
    "google-cloud-language>=2.13.0",
    "requests>=2.31.0",
    "pyttsx3>=2.90",
    "faster-whisper>=1.0.0",
    "kokoro>=0.9.4",
    "piper-tts>=1.2.0",
    "edge-tts>=6.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage   = "https://github.com/edudanielv/sett-framework"
Paper-EN   = "https://doi.org/10.5281/zenodo.21287133"
Paper-ES   = "https://doi.org/10.5281/zenodo.21287355"
Paper-JP   = "https://doi.org/10.5281/zenodo.21301700"
LinkedIn   = "https://www.linkedin.com/in/edudanielv/"

[tool.setuptools.packages.find]
where = ["."]
include = ["sett*"]
