[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sett-framework"
version = "0.14.0"
description = "Scalable Expert-based Task Topology: A multi-agent AI development framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eduardo Daniel Viñales" }
]
keywords = [
    "multi-agent", "AI", "framework", "SETT",
    "orchestrator", "LLM", "ethical-AI", "Badger",
    "executor", "actions-as-data"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = []  # Core framework has zero mandatory dependencies

[project.optional-dependencies]
anthropic       = ["anthropic>=0.40.0"]
openai          = ["openai>=1.40.0"]
gemini          = ["google-generativeai>=0.8.0"]
google-tts-stt  = ["google-cloud-texttospeech>=2.16.0", "google-cloud-speech>=2.26.0"]
google-sentiment = ["google-cloud-language>=2.13.0"]
elevenlabs      = ["requests>=2.31.0"]
voice-http      = ["requests>=2.31.0"]
deepgram        = ["requests>=2.31.0"]
azure-speech    = ["requests>=2.31.0"]
assemblyai      = ["requests>=2.31.0"]
gladia          = ["requests>=2.31.0"]
openai-audio    = ["requests>=2.31.0"]
cartesia        = ["requests>=2.31.0"]
local-tts       = ["pyttsx3>=2.99"]
local-stt       = ["faster-whisper>=1.0.0"]
kokoro          = ["kokoro>=0.9.4"]
piper           = ["piper-tts>=1.2.0"]
edge-tts        = ["edge-tts>=6.1.0"]
pocket-tts      = ["pocket-tts>=2.1.0,<3"]
all             = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    "google-cloud-texttospeech>=2.16.0",
    "google-cloud-speech>=2.26.0",
    "google-cloud-language>=2.13.0",
    "requests>=2.31.0",
    "pyttsx3>=2.99",
    "faster-whisper>=1.0.0",
    "kokoro>=0.9.4",
    "piper-tts>=1.2.0",
    "edge-tts>=6.1.0",
    "pocket-tts>=2.1.0,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.0",
    # The suite exercises the HTTP voice adapters against a mocked
    # transport, but their constructors import "requests" before any
    # mock applies. Without it, tests/test_adapter_credentials.py fails
    # for a missing package rather than reporting the credential rule it
    # exists to check. It is a test-environment requirement, not a
    # framework dependency: the core still installs with none (#12).
    "requests>=2.31.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "BLE",
    "B017", "DTZ001", "I001", "PIE790", "PIE810",
    "PLE2502", "PLE2515", "PLR0402", "PLR1711", "PYI034", "RET501",
    "RUF012", "RUF013", "RUF022", "RUF059", "RUF100",
    "SIM102", "SIM103", "SIM117", "UP035", "UP037",
]

[tool.ruff.lint.per-file-ignores]
# NullHandler must be installed before importing modules that can emit logs.
"sett/__init__.py" = ["E402"]

[project.urls]
Homepage   = "https://github.com/edudanielv/sett-framework"
Paper-EN   = "https://doi.org/10.5281/zenodo.21287133"
Paper-ES   = "https://doi.org/10.5281/zenodo.21287355"
Paper-JP   = "https://doi.org/10.5281/zenodo.21301700"
LinkedIn   = "https://www.linkedin.com/in/edudanielv/"

[tool.setuptools.packages.find]
where = ["."]
include = ["sett*"]
